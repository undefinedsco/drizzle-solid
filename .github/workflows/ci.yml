name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Lint
        run: yarn lint
        continue-on-error: true

      - name: Build
        run: yarn build

      - name: Run unit tests
        run: npx vitest --run tests/unit/
        env:
          SOLID_OIDC_ISSUER: http://localhost:3000

      - name: Upload coverage
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration-test:
    runs-on: ubuntu-latest
    # Only run on Node 22 (required by xpod)
    needs: unit-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build
        run: yarn build

      - name: Run integration tests
        # The release gate uses xpod's in-process real Pod runtime. Protocol
        # notification compatibility is covered separately because this runtime
        # does not expose the standard Solid notification transports.
        run: yarn test:integration:smoke
